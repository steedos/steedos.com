# Static Astro build. Pages are emitted as /a/b.html and served at /a/b, the
# same URLs the old Next.js site had (no trailing slash).
server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;

    # Behind the k8s ingress (TLS terminates there): keep Location relative.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/redirects.conf;

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "public, max-age=600";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
